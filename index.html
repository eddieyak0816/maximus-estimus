<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maximus Estimus — Field Assessment</title>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        if (window.location.pathname === '/maximus-estimus/404.html') {
          const redirectUrl = sessionStorage.getItem('redirect-url');
          if (redirectUrl) {
            sessionStorage.removeItem('redirect-url');
            window.history.replaceState(null, null, redirectUrl);
          }
        }
      })();
    </script>
  </body>
