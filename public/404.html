<!DOCTYPE html>
<html>
<head>
  <title>Redirect</title>
  <script>
    const path = window.location.pathname;
    const hash = window.location.hash;
    const search = window.location.search;
    sessionStorage.setItem('redirect-url', path.replace('/maximus-estimus/404.html', '') + hash + search);
    window.location.replace('/maximus-estimus/');
  </script>
</head>
<body></body>
</html>
